<main class="container">
<section id="consulta">
  <h2>Dejanos tu consulta</h2>
  <div class="row">
    <div class="col-md-12">
      <form id="formulario">
        <div class="mb-4">
          <label for="nombre-apellido" class="form-label">Nombre y apellido</label>
          <input type="text" class="form-control" id="nombre-apellido">
        </div>
        <div class="mb-4">
          <label for="correo" class="form-label">Correo electronico</label>
          <input type="email" class="form-control" id="correo" placeholder="ejemplo@gmail.com" required>
        </div>

        <div class="mb-4">
          <label for="tema" class="form-label">Motivo</label>
          <select class="form-select" aria-label="Default select example">
            <option value="1">Producto</option>
            <option value="2">Bateria</option>
            <option value="3">Conexion</option>
            <option value="4">Diseño</option>
          </select>
        </div>

        <div class="mb-4">
          <label for="exampleFormControlTextarea1" class="form-label">Mensaje</label>
          <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
        </div>
        <button type="button" class="btn btn-lg btn-success" disabled>Enviar</button>
      </form>
    </div>
  </div>
</section>
